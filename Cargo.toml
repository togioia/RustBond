[workspace]
members = ["shared", "server", "client"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/togioia/RustBond"

[workspace.dependencies]
tokio = { version = "1.47", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "macros",
    "sync",
    "fs",
] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
