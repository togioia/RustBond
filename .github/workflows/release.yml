name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rustbond

jobs:
  macos:
    name: macOS universal client
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build universal binary
        run: |
          cargo build --release --locked -p rnb-client --target aarch64-apple-darwin
          cargo build --release --locked -p rnb-client --target x86_64-apple-darwin
          mkdir -p out
          lipo -create -output out/rustbond \
            target/aarch64-apple-darwin/release/rustbond \
            target/x86_64-apple-darwin/release/rustbond
          file out/rustbond

      - name: Package .app bundle
        run: |
          APP="out/RustBond.app"
          mkdir -p "$APP/Contents/MacOS"
          cp out/rustbond "$APP/Contents/MacOS/RustBond"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>RustBond</string>
            <key>CFBundleDisplayName</key><string>RustBond</string>
            <key>CFBundleIdentifier</key><string>dev.algios.rustbond</string>
            <key>CFBundleExecutable</key><string>RustBond</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" out/RustBond-macos-universal.zip
          tar -czf out/rustbond-cli-macos-universal.tar.gz -C out rustbond
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            out/RustBond-macos-universal.zip
            out/rustbond-cli-macos-universal.tar.gz

  linux:
    name: Linux static server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          cargo build --release --locked -p rnb-server --target x86_64-unknown-linux-musl
          mkdir -p out
          cp target/x86_64-unknown-linux-musl/release/rustbond-server out/
          file out/rustbond-server
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/rustbond-server

  docker:
    name: Multi-arch image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:0.1.0
            ${{ env.IMAGE }}:latest

  release:
    name: GitHub release
    needs: [macos, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, 'debug') }}
          generate_release_notes: true
