name: publish

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id that produced the artifacts"
        required: true
      tag:
        description: "Release tag to publish"
        required: true
        default: v0.1-debug

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts from source run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          mkdir -p dist out
          gh run download "$RUN_ID" -D dist -R "${{ github.repository }}"
          find dist -type f -exec cp {} out/ \;
          ls -lh out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: RustBond ${{ inputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: out/*
