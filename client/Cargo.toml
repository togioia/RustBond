[package]
name = "rnb-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "RustBond macOS menu bar client"

[[bin]]
name = "rustbond"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:tray-icon"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
rnb-shared = { path = "../shared" }
if-addrs = "0.13"
dirs = "5"

eframe = { version = "0.28", optional = true, default-features = false, features = [
    "glow",
    "default_fonts",
] }
tray-icon = { version = "0.20", optional = true }
